name: AWS Service CI/CD

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying to CDK"
      # get repo
      - uses: actions/checkout@v7
      # download node lts
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      # get CDK 
      - name: Install dependencies
        run: npm ci
      # config auth
      - name: Print OIDC subject
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref}'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::157108548075:role/github-cdk-deploy
          aws-region: "us-east-1"
      # deploy - weeeeeeeeeeeeee
      - name: Deploy to AWS
        run: cdk deploy --require-approval=never
